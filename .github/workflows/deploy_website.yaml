name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      # Build a self-contained GitHub Pages deployment when no storage
      # configuration has been supplied through repository variables.
      - name: Build with local storage
        if: ${{ vars.VITE_STORAGE_ENGINE == '' }}
        run: VITE_BASE_PATH=/${{ github.event.repository.name }}/ VITE_STORAGE_ENGINE=localStorage yarn build

      # If on main with env vars, build with github environment variables
      - name: Build with github environment variables
        if: ${{ vars.VITE_STORAGE_ENGINE != '' }}
        run: VITE_BASE_PATH=/${{ github.event.repository.name }}/ VITE_STORAGE_ENGINE=$VITE_STORAGE_ENGINE yarn build
        env:
          VITE_STORAGE_ENGINE: ${{ vars.VITE_STORAGE_ENGINE }}

      - uses: peaceiris/actions-gh-pages@v3
        name: Deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Enable GitHub Pages
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                source: {
                  branch: 'gh-pages',
                  path: '/',
                },
              });
            }

      - name: Use the GitHub Pages URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.deleteCustomDomain({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
